# The whole wardrobe system: `docker compose up -d`
#
#   db     PostgreSQL - the single source of truth (wardrobe-bot/schema.sql + seed.sql on first start)
#   api    Style Vault backend: analysis queue, closet/inspo/profile/wear-log API, drop tracker
#   web    Caddy on :8080 - Style Vault app + /api behind a password, and the public Telegram webhook
#   bot    Telegram webhook receiver -> Style Vault (photos/links) and n8n (/fit /worn /purge /audit)
#
# Optional (enable with COMPOSE_PROFILES in .env, e.g. COMPOSE_PROFILES=tunnel or tunnel,n8n):
#   cloudflared  Cloudflare Tunnel to the web service (if you don't already run cloudflared on the Mac)
#   n8n          bundled n8n (if you don't already run n8n)

name: wardrobe

x-db-url: &db-url postgresql://${POSTGRES_USER:-wardrobe}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wardrobe}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wardrobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wardrobe}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./wardrobe-bot/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./wardrobe-bot/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # for n8n / psql on the Mac itself; never exposed beyond localhost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_PLAYWRIGHT: ${INSTALL_PLAYWRIGHT:-false}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *db-url
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      APP_USER: ${APP_USER:-me}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?set APP_PASSWORD_HASH in .env (run ./setup.sh)}
      API_PORT: ${API_PORT:-8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"     # point your Cloudflare Tunnel at http://localhost:8080
    depends_on:
      - api
      - bot

  bot:
    build: ./wardrobe-bot
    restart: unless-stopped
    env_file: .env
    environment:
      INGEST_URL: http://api:${API_PORT:-8000}/api/bot/ingest
      INSPO_URL: http://api:${API_PORT:-8000}/api/bot/inspo
      N8N_FIT_URL: ${N8N_BASE_URL:-http://host.docker.internal:5678}/webhook/wardrobe-fit
      N8N_WORN_URL: ${N8N_BASE_URL:-http://host.docker.internal:5678}/webhook/wardrobe-worn
      N8N_PURGE_URL: ${N8N_BASE_URL:-http://host.docker.internal:5678}/webhook/wardrobe-purge
      N8N_AUDIT_URL: ${N8N_BASE_URL:-http://host.docker.internal:5678}/webhook/wardrobe-audit
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach n8n running on the Mac itself

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}   # required when the tunnel profile is on
    depends_on:
      - web

  n8n:
    profiles: ["n8n"]
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      N8N_SECURE_COOKIE: "false"     # UI only on localhost
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8ndata:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  n8ndata:
