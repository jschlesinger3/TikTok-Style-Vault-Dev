# Everything on one small VM: Postgres (schema + seed applied on first start), n8n, the bot, and Caddy for HTTPS.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wardrobe
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe -d wardrobe"]
      interval: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      N8N_SECURE_COOKIE: "false"     # UI is only reached through an SSH tunnel on localhost
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8ndata:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"         # not public: ssh -L 5678:localhost:5678 you@server
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      N8N_INGEST_URL: http://n8n:5678/webhook/wardrobe-ingest
      N8N_INSPO_URL: http://n8n:5678/webhook/wardrobe-inspo
      N8N_FIT_URL: http://n8n:5678/webhook/wardrobe-fit
      N8N_WORN_URL: http://n8n:5678/webhook/wardrobe-worn
      N8N_PURGE_URL: http://n8n:5678/webhook/wardrobe-purge
      N8N_AUDIT_URL: http://n8n:5678/webhook/wardrobe-audit
    depends_on:
      - n8n

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - bot

volumes:
  pgdata:
  n8ndata:
  caddy_data:
